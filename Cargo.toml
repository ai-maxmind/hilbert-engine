[workspace]
resolver = "2"
members = [
    "crates/backend-physics",
    "crates/cli-bench",
    "crates/midend-egraph",
    "crates/frontend-dsl",
    "crates/midend-decompose",
    "crates/verify-bridge",
    "crates/meta-evolve",
    "crates/midend-tensor",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Mobifone AI Compiler Team"]
license = "MIT OR Apache-2.0"

[workspace.dependencies]
rand = "0.8.5"
rand_chacha = "0.3.1"
bytemuck = { version = "1.16", features = ["derive"] }
thiserror = "1.0.60"
clap = { version = "4.5", features = ["derive"] }
wgpu = "24.0"
pollster = "0.4"
egg = "0.11"
proptest = "1.5"
petgraph = "0.7"



